<!-- CM Promo Offer (WPCode, HTML, Site Wide Footer)
     Announces the live campaign served by app.chattermate.chat:
       D1 announcement bar above the global header (+ hero chip on the homepage)
       D2 pricing-card ribbon + first-year line + coupon chip (yearly toggle only)
       D3 promo band before the footer on /pricing/
     Reads GET /api/v1/enterprise/promotions/public (cached 5 min in sessionStorage)
     and renders nothing when no campaign is active - so the site never
     advertises an offer the checkout will refuse. ASCII only; cmp- prefix. -->
<style id="cmp-css">
.cmp-bar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:10px 24px;background:#C9F24E;color:#0B0C10;font-family:'Instrument Sans',system-ui,sans-serif;font-size:14.5px;font-weight:600;line-height:1.3;}
.cmp-bar .cmp-tag,.cmp-bar .cmp-left{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;white-space:nowrap;}
.cmp-bar .cmp-left{font-size:12px;opacity:.72;letter-spacing:.04em;}
.cmp-bar .cmp-msg{white-space:nowrap;}
.cmp-bar .cmp-code{font-family:'JetBrains Mono',monospace;font-weight:700;}
.cmp-bar a.cmp-cta{color:#0B0C10 !important;font-weight:700;border-bottom:1.5px solid rgba(11,12,16,.5);white-space:nowrap;text-decoration:none !important;}
.cmp-bar a.cmp-cta:hover{border-bottom-color:#0B0C10;}
@media (max-width:767px){.cmp-bar{gap:8px 12px;padding:9px 14px;font-size:13px;}.cmp-bar .cmp-msg{white-space:normal;text-align:center;flex-basis:100%;}.cmp-bar .cmp-tag{display:none;}}
.cmp-chip{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border-radius:999px;border:1px solid rgba(201,242,78,.4);background:rgba(201,242,78,.08);margin:0 0 22px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#C9F24E;letter-spacing:.04em;}
.cmp-chip .cmp-dot{width:7px;height:7px;border-radius:50%;background:#C9F24E;box-shadow:0 0 10px #C9F24E;}
.cmp-ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:#0B0C10;background:#C9F24E;border-radius:999px;padding:5px 14px;font-weight:700;white-space:nowrap;z-index:2;}
.cmp-first{margin:6px 0 0;font-family:'Instrument Sans',system-ui,sans-serif;font-size:13.5px;color:#AEB4C0;}
.cmp-first s{color:#7A8190;margin-right:6px;}
.cmp-first b{color:#C9F24E;font-weight:700;}
.cmp-coupon{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:10px 14px;border-radius:12px;background:rgba(201,242,78,.06);border:1px dashed rgba(201,242,78,.4);font-family:'Instrument Sans',system-ui,sans-serif;font-size:13px;color:#9CA3B0;}
.cmp-coupon b{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#C9F24E;letter-spacing:.06em;}
.cmp-coupon .cmp-tick{margin-left:auto;color:#C9F24E;}
.cmp-band{margin:48px auto 56px;max-width:1120px;padding:38px 40px;border:1px solid rgba(201,242,78,.3);border-radius:22px;background:linear-gradient(120deg,rgba(201,242,78,.12),#0E0F14 55%);font-family:'Instrument Sans',system-ui,sans-serif;color:#F5F6F8;}
.cmp-band .cmp-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#C9F24E;margin:0 0 14px;}
.cmp-band h2{font-family:'Space Grotesk',sans-serif !important;font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.03em;max-width:520px;margin:0 !important;color:#F5F6F8 !important;}
.cmp-band p{font-size:16px;color:#AEB4C0;line-height:1.55;max-width:520px;margin:14px 0 0;}
.cmp-band .cmp-row{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap;}
.cmp-band a.cmp-btn{display:inline-block;padding:15px 26px;background:#C9F24E !important;color:#0B0C10 !important;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none !important;}
.cmp-band .cmp-ends{font-size:14.5px;color:#9CA3B0;}
.cmp-band .cmp-ends b{color:#F5F6F8;font-weight:600;}
.cmp-band .cmp-ends span{font-family:'JetBrains Mono',monospace;color:#C9F24E;}
@media (max-width:767px){.cmp-band{margin:32px 16px 40px;padding:26px 22px;}.cmp-band h2{font-size:26px;}}
</style>
<script id="cmp-js">
(function(){
  var API='https://app.chattermate.chat/api/v1/enterprise/promotions/public';
  var SIGNUP='https://app.chattermate.chat/signup';
  var CACHE_KEY='cmp_public_v1', CACHE_MS=5*60*1000;
  var SYM={INR:String.fromCharCode(8377),USD:'$'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(n,cur){var v=Number(n);if(!isFinite(v))return '';return (SYM[cur]||'')+v.toLocaleString(undefined,{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2});}
  function pct(p){var v=Number(p);return Number.isInteger(v)?String(v):String(v);}
  function shortName(n){return String(n||'').replace(/\s*\((yearly|monthly)\)/i,'');}
  function interval(plans){var s=(plans||[]).map(function(p){return p.billing_interval;});return s.length&&s.every(function(i){return i==='yearly';})?'year':(s.length&&s.every(function(i){return i==='monthly';})?'month':'billing cycle');}
  function ymd(iso){var d=new Date(iso);return isNaN(d)?null:d;}
  function dateLabel(d){return d?d.toLocaleDateString(undefined,{day:'numeric',month:'long'}):'';}
  function dateShort(d){return d?d.toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase():'';}
  function expired(d){return d.getTime()<=Date.now();}
  // Each visitor's own clock starts when they sign up, so the site never
  // counts down. claim_label ("7 days") comes from the server already capped
  // at the campaign end; the copy states the cut-off and that window, once.
  function deadlineCopy(p,ends){
    var claim=p.claim_label?p.claim_label+' to claim':'';
    var parts=[];if(ends)parts.push('sign up by '+dateLabel(ends));if(claim)parts.push(claim);
    return {claim:claim,full:parts.join(' \u00b7 '),
      chip:claim?' \u00b7 '+claim:(ends?' \u00b7 ends '+dateLabel(ends):''),
      ribbon:claim?' \u00b7 '+claim.toUpperCase():(ends?' \u00b7 ENDS '+dateShort(ends):'')};
  }

  function load(cb){
    try{var raw=sessionStorage.getItem(CACHE_KEY);if(raw){var o=JSON.parse(raw);if(o&&Date.now()-o.t<CACHE_MS){cb(o.v);return;}}}catch(e){}
    fetch(API,{headers:{'Accept':'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(v){
      if(!v)return;try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),v:v}));}catch(e){}cb(v);
    }).catch(function(){});
  }

  function signupUrl(code){return SIGNUP+'?promo='+encodeURIComponent(code);}
  // The plans the campaign actually covers - never "every paid plan", which
  // was untrue the moment the offer was limited to the yearly ones.
  function planNames(p){return (p.plans||[]).map(function(x){return shortName(x.name);}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(' or ');}

  // D1 - announcement bar, above the sticky global header when present
  function mountBar(p,ends,copy){
    if(document.getElementById('cmp-bar'))return;
    var per=interval(p.plans);
    var names=planNames(p);
    var bar=document.createElement('div');bar.id='cmp-bar';bar.className='cmp-bar';bar.setAttribute('role','region');bar.setAttribute('aria-label','Promotional offer');
    bar.innerHTML='<span class="cmp-tag">LAUNCH OFFER</span>'+
      '<span class="cmp-msg">'+esc(pct(p.discount_percent))+'% off your first '+esc(per)+(names?' on '+esc(names):'')+' &middot; code <span class="cmp-code">'+esc(p.code)+'</span></span>'+
      (copy.full?'<span class="cmp-left">'+esc(copy.full)+'</span>':'')+
      '<a class="cmp-cta" href="'+esc(signupUrl(p.code))+'">Claim it &rarr;</a>';
    var host=document.getElementById('cmgh');
    if(host){host.insertBefore(bar,host.firstChild);}else{document.body.insertBefore(bar,document.body.firstChild);}
  }

  // homepage hero chip, in front of the first h1 of the page content
  function mountHeroChip(p,copy){
    if(location.pathname!=='/'||document.getElementById('cmp-chip'))return;
    var h1=document.querySelector('.pxl-entry-content h1, main h1');if(!h1)return;
    var chip=document.createElement('div');chip.id='cmp-chip';chip.className='cmp-chip';
    chip.innerHTML='<span class="cmp-dot"></span><span>first '+esc(interval(p.plans))+' '+esc(pct(p.discount_percent))+'% off &middot; '+esc(p.code)+esc(copy.chip)+'</span>';
    h1.parentNode.insertBefore(chip,h1);
  }

  // D2 - pricing cards: ribbon, first-year line and coupon chip, yearly toggle only
  // A plan card = the ancestor of the price span (span > span > price row > card).
  // The card's name is the element whose whole text is "Base" or "Pro" - never
  // a substring match, or "Knowledge Base" in the Free card would qualify it.
  function planNameOf(card){var els=card.querySelectorAll('div,span,h2,h3');for(var i=0;i<els.length;i++){var t=(els[i].textContent||'').trim();if(t==='Base'||t==='Pro')return t;}return null;}
  function pricingCards(){
    var out=[];document.querySelectorAll('.cm-pv[data-yu]').forEach(function(pv){
      var yu=(pv.getAttribute('data-yu')||'').trim();
      if(!/^[^\d]{0,2}\d[\d,.]*$/.test(yu)||/^\D*0$/.test(yu))return; // a bare price only (not "billed annually" lines), never Free's $0
      var card=pv.parentElement&&pv.parentElement.parentElement&&pv.parentElement.parentElement.parentElement;if(!card)return;
      if(out.some(function(o){return o.card===card;}))return;
      var name=planNameOf(card);if(!name)return;
      out.push({card:card,pv:pv,name:name});
    });return out;
  }
  // The page's own top badge ("MOST POPULAR") sits where the ribbon goes
  function existingBadge(card){for(var i=0;i<card.children.length;i++){var c=card.children[i];if(/MOST POPULAR/i.test(c.textContent||'')&&(c.textContent||'').trim().length<20)return c;}return null;}
  function yearlyActive(){var y=document.getElementById('cm-bt-y');return !!y&&/rgb\(201,\s*242,\s*78\)|#C9F24E/i.test(y.style.background||'');}
  function currencyOf(pv){var t=(pv.textContent||'').trim();return t===pv.getAttribute('data-yi')||t===pv.getAttribute('data-mi')?'INR':'USD';}
  function mountPricing(p,ends,copy){
    if(location.pathname.indexOf('/pricing')!==0)return;
    var cards=pricingCards();if(!cards.length)return;
    var byName={};(p.plans||[]).forEach(function(pl){byName[shortName(pl.name)]=pl;});
    cards.forEach(function(c){
      var plan=byName[c.name];if(!plan)return;
      c.card.style.position='relative';
      var badge=existingBadge(c.card);
      var rib=document.createElement('div');rib.className='cmp-ribbon';rib.textContent=pct(p.discount_percent)+'% OFF FIRST '+interval([plan]).toUpperCase()+copy.ribbon;
      var line=document.createElement('p');line.className='cmp-first';
      var coupon=document.createElement('div');coupon.className='cmp-coupon';coupon.innerHTML='<b>'+esc(p.code)+'</b><span>pre-filled at checkout</span><span class="cmp-tick">&#10003;</span>';
      var priceRow=c.pv.parentElement.parentElement;
      priceRow.parentNode.insertBefore(line,priceRow.nextSibling);
      line.parentNode.insertBefore(coupon,line.nextSibling);
      c.card.appendChild(rib);
      function paint(){
        var yearly=yearlyActive(),cur=currencyOf(c.pv);
        var list=plan.prices&&plan.prices[cur],first=plan.first_cycle_prices&&plan.first_cycle_prices[cur];
        var show=yearly&&list!=null&&first!=null;
        rib.style.display=show?'':'none';coupon.style.display=show?'':'none';line.style.display=show?'':'none';
        if(badge)badge.style.visibility=show?'hidden':'';
        if(show){line.innerHTML='<s>'+esc(money(list,cur))+'</s> <b>'+esc(money(first,cur))+'</b> per agent for year one, then '+esc(money(list,cur))+'/yr';}
      }
      paint();
      ['cm-bt-m','cm-bt-y'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',function(){setTimeout(paint,0);});});
      new MutationObserver(paint).observe(c.pv,{childList:true,characterData:true,subtree:true});
    });
    // D3 - promo band before the footer
    if(!document.getElementById('cmp-band')){
      var footer=document.getElementById('pxl-footer-elementor')||document.querySelector('footer');
      var band=document.createElement('section');band.id='cmp-band';band.className='cmp-band';
      band.innerHTML='<p class="cmp-eyebrow">LAUNCH OFFER &middot; '+esc(p.code)+'</p>'+
        '<h2>'+esc(pct(p.discount_percent))+'% off your first '+esc(interval(p.plans))+(planNames(p)?' on '+esc(planNames(p)):'')+'</h2>'+
        '<p>Same open-source product, same self-host option &mdash; just cheaper while we are early. The code applies automatically at checkout.</p>'+
        '<div class="cmp-row"><a class="cmp-btn" href="'+esc(signupUrl(p.code))+'">Claim '+esc(pct(p.discount_percent))+'% off</a>'+
        (ends?'<span class="cmp-ends">Sign up by <b>'+esc(dateLabel(ends))+'</b>'+(copy.claim?' &middot; <span>'+esc(copy.claim)+'</span>':'')+'</span>':'')+'</div>';
      if(footer&&footer.parentNode){footer.parentNode.insertBefore(band,footer);}else{document.body.appendChild(band);}
    }
  }

  function render(p){
    if(!p||!p.active||!p.code)return;
    var ends=p.ends_at?ymd(p.ends_at):null;
    if(ends&&expired(ends))return;
    var copy=deadlineCopy(p,ends);
    var go=function(){mountBar(p,ends,copy);mountHeroChip(p,copy);mountPricing(p,ends,copy);};
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',go);}else{go();}
    // the global header mounts itself on DOMContentLoaded; re-home the bar once it exists
    var tries=0,t=setInterval(function(){var host=document.getElementById('cmgh'),bar=document.getElementById('cmp-bar');if(host&&bar&&bar.parentNode!==host){host.insertBefore(bar,host.firstChild);}if(host||++tries>20)clearInterval(t);},250);
  }
  load(render);
})();
</script>
